    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ai_mastery_dark_mode');
          var isDark = saved === null ? true : JSON.parse(saved);
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
